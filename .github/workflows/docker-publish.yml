name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - feature/loyalty-system

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Soften flaky Docker Hub metadata timeouts on GH runners
          provenance: false
          # Vite bakes these at build time. Prefer repository Variables (or Secrets) in GitHub:
          # Settings → Secrets and variables → Actions → Variables: VITE_GOOGLE_CLIENT_ID, etc.
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api' }}
            VITE_BRAND_LOGO_URL=${{ vars.VITE_BRAND_LOGO_URL }}
            VITE_ADMIN_ORDER_ALERT_SOUND_URL=${{ vars.VITE_ADMIN_ORDER_ALERT_SOUND_URL || '/admin-order-alert.mp3' }}
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.run_started_at }}
