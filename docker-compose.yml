version: '3.8'

# Portainer: prefer pulling GHCR image (image: below).
# Local rebuild: docker compose build --build-arg VITE_GOOGLE_CLIENT_ID=...
services:
  app:
    image: ghcr.io/areppp06/takcakap.com-v2:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_BRAND_LOGO_URL: ${VITE_BRAND_LOGO_URL:-}
        VITE_ADMIN_ORDER_ALERT_SOUND_URL: ${VITE_ADMIN_ORDER_ALERT_SOUND_URL:-/admin-order-alert.mp3}
    container_name: takcakap-app
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-takcakap}
      - DB_PASSWORD=${DB_PASSWORD:-takcakap_pass}
      - DB_NAME=${DB_NAME:-takcakap}
      - PUBLIC_APP_URL
      - LALAMOVE_API_KEY
      - LALAMOVE_API_SECRET
      - CURLEC_KEY_ID
      - CURLEC_KEY_SECRET
      - JWT_SECRET
      - CORS_ORIGINS
      - ADMIN_PORT
      - ADMIN_EMAIL
      - ADMIN_PASSWORD
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_SECURE
      - SMTP_USER
      - SMTP_PASS
      - SMTP_FROM_NAME
      - SMTP_FROM_EMAIL
      - SMTP_TLS_SERVERNAME
      - GOOGLE_CLIENT_ID
      - VITE_GOOGLE_CLIENT_ID
      - METRICS_AUTH_TOKEN
      - CURLEC_WEBHOOK_SECRET
      - LALAMOVE_WEBHOOK_SECRET
      - R2_ACCOUNT_ID
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - R2_BUCKET_NAME
      - R2_PUBLIC_URL_PREFIX
      - VAPID_PUBLIC_KEY
      - VAPID_PRIVATE_KEY
      # Admin Android FCM (server-side send). Must be listed or Compose will not inject it.
      - FIREBASE_SERVICE_ACCOUNT_JSON
      - GOOGLE_APPLICATION_CREDENTIALS
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: takcakap-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_pass_here}
      - MYSQL_DATABASE=${DB_NAME:-takcakap}
      - MYSQL_USER=${DB_USER:-takcakap}
      - MYSQL_PASSWORD=${DB_PASSWORD:-takcakap_pass}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
