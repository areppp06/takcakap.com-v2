version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: takcakap-app
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-takcakap}
      - DB_PASSWORD=${DB_PASSWORD:-takcakap_pass}
      - DB_NAME=${DB_NAME:-takcakap}
      - PUBLIC_APP_URL
      - LALAMOVE_API_KEY
      - LALAMOVE_API_SECRET
      - CURLEC_KEY_ID
      - CURLEC_KEY_SECRET
      - JWT_SECRET
      - CORS_ORIGINS
      - ADMIN_PORT
      - ADMIN_EMAIL
      - ADMIN_PASSWORD
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_SECURE
      - SMTP_USER
      - SMTP_PASS
      - SMTP_FROM_NAME
      - SMTP_FROM_EMAIL
      - SMTP_TLS_SERVERNAME
      - GOOGLE_CLIENT_ID
      - VITE_GOOGLE_CLIENT_ID
      - METRICS_AUTH_TOKEN
      - CURLEC_WEBHOOK_SECRET
      - LALAMOVE_WEBHOOK_SECRET
      - R2_ACCOUNT_ID
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - R2_BUCKET_NAME
      - R2_PUBLIC_URL_PREFIX
      - VAPID_PUBLIC_KEY
      - VAPID_PRIVATE_KEY
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: takcakap-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_pass_here}
      - MYSQL_DATABASE=${DB_NAME:-takcakap}
      - MYSQL_USER=${DB_USER:-takcakap}
      - MYSQL_PASSWORD=${DB_PASSWORD:-takcakap_pass}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
